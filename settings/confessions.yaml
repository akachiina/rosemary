# The confessions settings.
settings:
  confessions.enabled:
    category: confessions
    type: boolean
    default: false
  confessions.public_channel:
    category: confessions
    type: channel
    default: null
  confessions.review_channel:
    category: confessions
    type: channel
    default: null
  confessions.review_required:
    category: confessions
    type: boolean
    default: false
  confessions.reveal_author:
    category: confessions
    type: boolean
    default: false
  confessions.mark_op:
    category: confessions
    type: boolean
    default: true
  confessions.sealed_author:
    category: confessions
    type: boolean
    default: true
  confessions.key_rotation_days:
    category: confessions
    type: integer
    default: 2592000
    duration: true
  confessions.moderation_days:
    category: confessions
    type: integer
    default: 604800
    duration: true
  confessions.shamir_threshold:
    category: confessions
    type: integer
    default: 3
    min: 2
    max: 10
  confessions.shamir_shares:
    category: confessions
    type: integer
    default: 5
    min: 2
    max: 20