# The general settings.
settings:
  general.timezone:
    category: general
    type: string
    default: "UTC"
  general.prefix:
    category: general
    type: string
    default: "!"
  general.menu_timeout:
    category: general
    type: integer
    default: 900
    min: 60
    max: 900
    duration: true
  updater.notify_admins:
    category: general
    type: boolean
    default: true
  bot.nickname:
    category: general
    type: string
    default: ""
  bot.avatar:
    category: general
    type: image
    default: false
  bot.banner:
    category: general
    type: image
    default: false
