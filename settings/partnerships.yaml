# The partnerships settings.
settings:
  partnerships.enabled:
    category: partnerships
    type: boolean
    default: false
  partnerships.channel:
    category: partnerships
    type: channel
    default: null
  partnerships.role:
    category: partnerships
    type: role
    default: null
  partnerships.ping_role:
    category: partnerships
    type: role
    default: null
  partnerships.invite_text:
    category: partnerships
    type: string
    default: ""
    multiline: true
  partnerships.renewal_days:
    category: partnerships
    type: integer
    default: 15
    min: 1
    max: 90
  partnerships.grace_days:
    category: partnerships
    type: integer
    default: 3
    min: 0
    max: 30
