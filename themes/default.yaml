# Rosemary built-in theme: the single source of truth for the bot's look.
#
# This one file feeds both layers:
#   * the built-in fallback theme (bot.theme, used by guilds with no active
#     theme) - loaded at boot by bot.py;
#   * the selectable/importable "default" theme in /themes (ThemeStore
#     discovers it in themes/).
#
# Copy this file, rename it, tweak values - or import modified copies per
# guild. NOT a translation resource.
#
# Layers:
#   colors  - design tokens referenced from code via theme.color("<name>").
#   emojis  - injected automatically into every translated string. Any "{<key>}"
#             used in a language file resolves to the emoji below, so adding a
#             new entry here makes it usable in any catalog without code changes.
#   markdown - structural text templates (titles, entries, footers).
#   styles  - open-ended named presentation styles. Each style may carry color,
#             template, prefix, suffix and footer; styles inherit through
#             "extends" and unknown names fall back to "base". Edit this file
#             to re-theme the whole bot without touching code.

colors:
  brand: "#57F287"
  success: "#2ECC71"
  warning: "#F1C40F"
  danger: "#E74C3C"
  info: "#3498DB"
  gold: "#FFD700"
  orange: "#FF8C00"

# NOTE: `user` and `tag` collide with common template variable names. Template
# variables always win over emoji tokens, so `{user}` renders a mention (never
# 👤) and `{tag}` only renders 🏷️ where no `tag=` variable is passed.
# `loading`/`hourglass` and `swap`/`refresh` share glyphs on purpose: separate
# names keep each surface independently customizable.
emojis:
  star: "⭐"
  success: "✅"
  check: "✅"
  error: "❌"
  warning: "⚠️"
  info: "ℹ️"
  loading: "⏳"
  ban: "🚫"
  kick: "👢"
  mute: "🔇"
  gear: "⚙️"
  palette: "🎨"
  envelope: "✉️"
  door: "🚪"
  scroll: "📜"
  pencil: "✏️"
  members: "👥"
  people: "👥"
  plus: "➕"
  minus: "➖"
  refresh: "🔄"
  swap: "🔄"
  back: "⬅️"
  register: "📝"
  trash: "🗑️"
  crown: "👑"
  user: "👤"
  tag: "🏷️"
  love_letter: "💌"
  clock: "⏰"
  numbers: "🔢"
  frame: "🖼️"
  cup: "🍵"
  trophy: "🏆"
  calendar: "📅"
  gift: "🎁"
  bar_chart: "📊"
  cry: "😢"
  tada: "🎉"
  rocket: "🚀"
  lock: "🔒"
  unlock: "🔓"
  speech: "💬"
  volume: "🔊"
  search: "🔍"
  hourglass: "⏳"
  up: "⬆️"
  down: "⬇️"

# markdown: structural text templates rendered inside TextDisplay components.
# These are visual/theme-level, NOT translated. Placeholders are filled via
# Theme.md(name, **kwargs); the emojis above are injected automatically, so any
# template can reference them (e.g. "{success}").
markdown:
  title: "# {title}"
  category: "**{category_label}:** {category}"
  entry: "**{label}:**\n{value}"
  edit_title: "# {label}"
  section: "## {title}"
  footer: "-# *{text}*"

# styles: named presentation styles used by any component. Properties:
#   color    - a color token name (see colors above).
#   template - a markdown template name (see markdown above).
#   prefix   - decoration rendered before the templated body.
#   suffix   - decoration rendered after the templated body.
#   footer   - optional footer line (e.g. for log cards).
# Styles inherit via "extends"; everything falls back to "base". Emoji tokens
# may be used in any field and are resolved automatically.
styles:
  base:
    color: "info"
    template: "title"
    prefix: ""
    suffix: ""
    footer: ""
  title: { extends: base }
  entry: { extends: base, template: "entry" }
  menu: { extends: base, color: "brand" }
  log: { extends: base }
  success: { extends: base, color: "success" }
  warning: { extends: base, color: "warning" }
  danger: { extends: base, color: "danger" }
  info: { extends: base, color: "info" }
  boost_log: { extends: log }
  boost_preview: { extends: base, color: "success" }
  bump_reminder: { extends: base, color: "brand" }
  bump_leaderboard: { extends: base, color: "warning" }
  bump_no_data: { extends: base, color: "info" }
  bump_test: { extends: base, color: "brand" }
  # Starboard: cor contínua por estrelas (rampa amarela, do fraco ao forte).
  # `star_ramp.limit` é a contagem de estrelas que atinge o tom forte; a partir
  # dela a cor para de mudar. `star_tier_1` continua como fallback para temas
  # que não definem rampa.
  star_tier_1: { extends: base, color: "warning" }
  star_tier_2: { extends: base, color: "warning" }
  star_tier_3: { extends: base, color: "gold" }
  star_tier_5: { extends: base, color: "gold" }
  star_tier_8: { extends: base, color: "orange" }
  star_tier_13: { extends: base, color: "orange" }
  star_ramp:
    from_color: "#F7EFA8"
    to_color: "#FF8C00"
    limit: 13

# Título do post do starboard por marco de estrelas (o maior marco alcançado
# vence; abaixo do primeiro, cai para o emoji `star` comum).
star_tier_emoji:
  3: "✨"
  8: "💫"
  13: "🌟"

# bump defaults: used to reset or provide a base for the MVP role
bump:
  mvp_default_name: "🚀 Bump-MVP"
  mvp_default_color: "warning"
  mvp_default_emoji: "🚀"

# medals: rank emojis for the weekly bump leaderboard. Keys 1..3 are the top
# three positions; any other rank falls back to "default".
medals:
  1: "🥇"
  2: "🥈"
  3: "🥉"
  default: "📊"

# Color panel image: HTML rendered to a transparent PNG (WeasyPrint).
# `html` is the page frame - __ITEMS__ receives the per-color markup,
# __PANEL_W__/__PANEL_H__ anchor the PDF page (the PNG is cropped to
# content, so page size only matters for layout). `item` is one row per
# color: {number}, {name}, {color}/{hex} (same value), all HTML-escaped
# except the color itself. Layout notes: WeasyPrint speaks a CSS subset - # multi-column + inline-block render faithfully; flexbox/grid do not.
color_panel:
  html: |
    <style>
    @page { size: __PANEL_W__px __PANEL_H__px; margin: 0; background: transparent; }
    html, body { margin: 0; padding: 0; background: transparent; }
    .grid { column-count: 2; column-gap: 64px; padding: 8px; }
    /* No overflow rule: the renderer grows the page until every label fits
       (render_panel measures the PDF and re-renders wider on clipping). */
    .item {
      font-family: "Segoe UI", "Ubuntu", "Noto Sans", sans-serif;
      font-size: 26px;
      font-weight: 600;
      color: #dbdee1;
      white-space: nowrap;
    }
    .dot {
      display: inline-block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      vertical-align: -4px;
      margin-right: 10px;
    }
    </style>
    <div class="grid">__ITEMS__</div>
  item: |
    <div class="item"><span class="dot" style="background: {color}"></span>{number}. {name}</div>

# Chat snapshot image (audit message_delete/edit logs): a deleted/edited
# message rendered as a Discord-style chat bubble PNG (WeasyPrint, like the
# color panel). `page` is the frame (__ITEMS__ receives the bubbles,
# __PAGE_W__/__PAGE_H__ anchor the PDF page; the PNG is cropped to content).
# `bubble` is one message; `image` wraps an embedded attachment. Bubble
# placeholders: {author_name}, {author_color} (#rrggbb top-role color),
# {author_avatar} (data URI), {bot} (APP badge or empty), {time}
# (dd/mm/yyyy hh:mm:ss), {content} (HTML-escaped, newlines as <br>, capped)
# and {image}. Layout notes: WeasyPrint speaks a CSS subset - tables +
# inline-block render faithfully; flexbox/grid do not; HTML width/height
# attributes on <img> are IGNORED (size images with CSS width/height only);
# word-break: break-word is rejected (use overflow-wrap). Keep the image
# preview within the page height budget (max-height caps tall scans:
# WeasyPrint splits an overflowing bubble across PDF pages and the raster
# drops the second page, the image included). No overflow rule: text is
# pre-capped.
snapshot:
  page: |
    <style>
    @page { size: __PAGE_W__px __PAGE_H__px; margin: 0; background: transparent; }
    html, body { margin: 0; padding: 0; background: transparent; }
    </style>
    <div class="page">__ITEMS__</div>
  bubble: |
    <table class="bubble" style="background: #32353b; border-radius: 8px; margin: 0 0 12px 0; padding: 0; border-collapse: collapse; border-spacing: 0;"><tr>
    <td class="avatar" style="vertical-align: top; padding: 12px 0 12px 14px;"><img src="{author_avatar}" style="width: 40px; height: 40px; border-radius: 50%; display: block;" /></td>
    <td class="body" style="padding: 10px 14px 12px 12px;">
      <div class="header" style="font-family: 'Segoe UI', 'Ubuntu', 'Noto Sans', sans-serif; font-size: 15px; font-weight: 600; color: #ffffff;">{author_name}{bot}<span class="time" style="font-size: 12px; font-weight: 400; color: #949ba4; margin-left: 8px;">{time}</span></div>
      <div class="content" style="font-family: 'Segoe UI', 'Ubuntu', 'Noto Sans', sans-serif; font-size: 15px; line-height: 1.3; color: #dcddde; white-space: pre-wrap; overflow-wrap: break-word;">{content}</div>
      {image}
    </td>
    </tr></table>
  image: |
    <img class="attachment" src="{image}" style="border-radius: 4px; margin-top: 8px; max-width: 320px; max-height: 240px;" />

# Interactions (roleplay) gifs: the DEFAULT source per action, used when a
# guild has no own list (the manager seeds it on first edit). Two entry
# shapes: `api: <category>` fetches a RANDOM gif from that nekos.best
# category at every send (no keys, free API), and `url: <link>` pins one
# static gif. A guild that edits its list in /settings replaces this whole
# section for itself (mix both shapes freely there).
roleplay:
  gifs:
    hug:
      - api: hug
    kiss:
      - api: kiss
    pat:
      - api: pat
    slap:
      - api: slap
    bite:
      - api: bite
    punch:
      - api: punch
    attack:
      - api: kick
    poke:
      - api: poke
    dance:
      - api: dance
    highfive:
      - api: highfive
    stare:
      - api: stare
    cuddle:
      - api: cuddle
