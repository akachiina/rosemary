# The listings: the cards that show a list of things.
#
# A listing has a title (the name of the list) and a body (the rows). The
# body comes in two flavors: the copy lives in the catalog (the bump
# reminder, the trap notice, the about card) or the send site builds it and
# sends it as the {body} variable (the invites, the leaderboards).
#
# The title follows the same rule: the catalog names it (the copy of the
# feature) or the send site sends it as the {title} variable.

about.card:
  archetype: listing
  color: neutral
  title: '{about.title}'
  thumbnail: '{bot_avatar}'
  paragraphs:
  - '{about.text}'
  - '{about.version}'
  - '{about.build}'
  - '{host_line}'
  variables:
  - version
  - channel
  - build
  - host_line
  - bot_avatar
  - bot_banner
  category: general

bump.reminder:
  archetype: listing
  color: brand
  title: '{bump.messages.reminder_title}'
  description: 'Já se passou o cooldown de {cooldown} desde o último bump!'
  fields:
  - label: '{bump.messages.reminder_turn_label}'
    value: 'use `/bump` e ganhe um ponto no placar!'
    inline: false
  # The role ping rides the opening line of the card (the first block of the
  # V2, above the frame), so the reminder is one message: the ping and the
  # card travel together.
  ping_line: '{ping_role}'
  variables:
  - cooldown
  - ping_role
  mention: role
  category: bump

bump.no_bumps:
  archetype: listing
  title: '{bump.messages.no_bumps_title}'
  description: 'Ninguém deu bump esta semana! {cry}'
  fields:
  - label: '{bump.messages.no_bumps_first_label}'
    value: 'use `/bump` no canal de bump e ganhe um ponto no placar!'
    inline: false
  variables: []
  category: bump

# The bump thank-you: the bumper's avatar rides the title, the body tells
# when the next bump is and the attribution closes the card. The color comes
# from the theme style of the reminder: the send site resolves the style to
# its token and the document picks it up (the theme owns what it means).
bump.thank_you:
  archetype: listing
  color:
  - '{state_color}'
  - 'brand'
  title: '{bump.messages.thank_you_title}'
  paragraphs:
  - '{bump.messages.thank_you_next}'
  - '{bump.messages.thank_you_reminder}'
  - '{bump.messages.thank_you_hint}'
  ping_line: '{bump.messages.ping_thank_you}'
  thumbnail: '{user_avatar}'
  footer: '{timestamp}'
  timestamp: true
  variables:
  - mention
  - cooldown
  - next_bump_timestamp
  - user_avatar
  - user_name
  - user
  - timestamp
  mention: single
  category: bump

# The weekly leaderboard: the winner's avatar rides the title and the body
# names the winner and the ranking. No attribution footer: it is a ranking
# posted by the bot, not an action by the member in first place. The color
# comes from the theme style of the leaderboard.
bump.leaderboard:
  archetype: listing
  color:
  - '{state_color}'
  - 'warning'
  title: '{bump.messages.leaderboard_title}'
  description: 'Confira quem mais ajudou o servidor esta semana!'
  fields:
  - label: '{bump.messages.leaderboard_period_label}'
    value: '<t:{start_timestamp}:d> até <t:{end_timestamp}:d>'
    inline: false
  - label: '{bump.messages.leaderboard_ends_label}'
    value: '<t:{next_reset_timestamp}:R>'
    inline: false
  - label: '{bump.messages.leaderboard_winner_label}'
    value: '{@winner_mention} com **{winner_count}** bumps!'
    inline: false
  - label: '{bump.messages.leaderboard_prize_label}'
    value: 'Cargo **{role_name}** customizável por 1 semana!'
    inline: false
  paragraphs:
  - 'Use `/boost painel` para personalizar nome, cor, emoji e convidar membros.'
  - '{leaderboard_list}'
  ping_line: '{bump.messages.ping_leaderboard}'
  thumbnail: '{winner_avatar}'
  footer: '{timestamp}'
  timestamp: true
  variables:
  - winner_mention
  - winner_name
  - winner_count
  - winner_avatar
  - role_name
  - leaderboard_list
  - start_timestamp
  - end_timestamp
  - next_reset_timestamp
  - user
  - timestamp
  mention: winner_auto
  category: bump

