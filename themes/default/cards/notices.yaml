# The confession ban DM: the member is told the action and the motive, in
# the same plain-text grammar as the moderation notices.
confessions.dm.banned:
  archetype: notice
  style: error
  description: '{confess.dm.banned}'
  variables:
  - reason
  category: confessions

# The staff's key share (a sealed guild): the bot cannot read the author, so
# it sends one Shamir share per holder by DM. The share is the only proof the
# member keeps; the public card carries the fingerprint and the claim token.
confessions.dm.key_share:
  archetype: notice
  style: info
  description: '{confess.dm.key_share}'
  variables:
  - guild
  - share
  - threshold
  - total
  category: confessions

