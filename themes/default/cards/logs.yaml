# The staff log events: one document per event.
#
# The document is semantic: it says what the log is (title, body,
# fields, author, footer) and points at the catalog for the copy.
# The author is the subject of the event (a display name and an avatar);
# the footer attributes the actor in readable text (a theme may reintroduce
# the old token, the serializer drops the line) and the native timestamp
# carries the instant in the reader's timezone.
moderation.logs.ban:
  archetype: log_event
  form: embed
  color: danger
  title: '{moderation.logs.ban.title}'
  fields:
  - target: '{member}'
  - member_id: '{member_id}'
  - moderator: '{moderator}'
  - reason: '{reason}'
  actor: '{moderator}'
  author: '{member_name}'
  author_icon: '{user_avatar}'
  timestamp: true
  variables:
  - member
  - member_id
  - moderator
  - reason
  - member_label
  - member_id_label
  - moderator_label
  - reason_label
  - timestamp
  - actor
  - user_avatar
  - member_name
  - actor_name
  - actor_avatar
  mention: none
  category: moderation
