# The audit events: one document per event.
#
# The audit card is the registry entry of a moderation-relevant event: the
# member owns the author line, the event owns the title and the body, and
# the footer names the actor (the moderator) when there is one.
#
# The body keeps the composed lines the send site prepares (the reason, the
# moderator, the transcript, the attachments): they arrive as variables, so
# the card never shows a half-written line.

audit.ban:
  archetype: audit_event
  color: danger
  title: '{ban} {card.audit.ban.title}'
  description: '{card.audit.ban.body}'
  actor: '{moderator}'

audit.unban:
  archetype: audit_event
  color: success
  title: '{check} {card.audit.unban.title}'
  description: '{card.audit.unban.body}'
  actor: '{moderator}'

audit.bulk_delete:
  archetype: audit_event
  color: warning
  title: '{trash} {card.audit.bulk_delete.title}'
  fields:
  - label: '{card.audit.bulk_delete.deleted_label}'
    value: '{count} em {channel}'
    inline: false
  - label: '{card.audit.bulk_delete.moderator_label}'
    value: '{moderator}'
    inline: false
  - label: '{card.audit.bulk_delete.file_label}'
    value: '[abrir arquivo]({file_url})'
    inline: false
    optional: true
  actor: '{moderator}'
  rich: false

audit.nickname:
  archetype: audit_event
  color: info
  title: '{swap} {card.audit.nickname.title}'
  fields:
  - label: '{card.audit.nickname.before_label}'
    value: '{old_name}'
    inline: false
  - label: '{card.audit.nickname.after_label}'
    value: '{new_name}'
    inline: false

audit.avatar:
  archetype: audit_event
  color: info
  title: '{frame} {card.audit.avatar.title}'
  fields:
  - label: '{card.audit.avatar.before_label}'
    value: '[ver avatar]({old_avatar})'
    inline: false
  - label: '{card.audit.avatar.after_label}'
    value: '[ver avatar]({new_avatar})'
    inline: false

audit.roles:
  archetype: audit_event
  color: info
  title: '{tag} {card.audit.roles.title}'
  description: '{card.audit.roles.body}'

audit.timeout:
  archetype: audit_event
  color: danger
  title: '{mute} {card.audit.timeout.title}'
  description: '{card.audit.timeout.body}'

audit.voice_join:
  archetype: audit_event
  color: success
  title: '{door} {card.audit.voice_join.title}'
  description: '{card.audit.voice_join.body}'

audit.voice_leave:
  archetype: audit_event
  color: info
  title: '{door} {card.audit.voice_leave.title}'
  description: '{card.audit.voice_leave.body}'

audit.trap:
  archetype: audit_event
  color: danger
  title: '{lock} {card.audit.trap.title}'
  fields:
  - label: '{card.audit.trap.channel_label}'
    value: '{channel}'
    inline: false
  - label: '{card.audit.trap.consequence_label}'
    value: '{action}'
    inline: false
  - label: '{card.audit.trap.outcome_label}'
    value: '{outcome}'
    inline: false
  # The trap card names the consequence and the outcome the send site decided.
  variables:
    $append: true
    items:
      - action
      - outcome

audit.message_delete:
  archetype: audit_event
  color: warning
  title: '{trash} {card.audit.message_delete.title}'
  fields:
  - label: '{card.audit.message_delete.author_label}'
    value: '{message_author}'
    inline: true
  - label: '{card.audit.message_delete.channel_label}'
    value: '{channel}'
    inline: true
  - label: '{card.audit.message_delete.message_label}'
    value: '{message}'
    inline: false
  - label: '{card.audit.message_delete.attachments_label}'
    value: '{attachments_line}'
    inline: false
    optional: true
  image:
    - '{chat_image}'
    - '{image_url}'

audit.message_edit:
  archetype: audit_event
  color: info
  title: '{pencil} {card.audit.message_edit.title}'
  fields:
  - label: '{card.audit.message_edit.author_label}'
    value: '{message_author}'
    inline: true
  - label: '{card.audit.message_edit.channel_label}'
    value: '{channel}'
    inline: true
  - label: '{card.audit.message_edit.before_label}'
    value: '{message}'
    inline: false
  - label: '{card.audit.message_edit.after_label}'
    value: '{new_message}'
    inline: false
  - label: '{card.audit.message_edit.attachments_label}'
    value: '{attachments_line}'
    inline: false
    optional: true
  image:
    - '{chat_image}'
    - '{image_url}'
