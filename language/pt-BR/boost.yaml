  dm:
    registered: |
      {success} Você recebeu um Cargo Boost!

      Olá, {mention}! O cargo boost @{role_name} foi registrado para você no **{server_name}**.

      {pencil} Renomeie e escolha um emoji
      {palette} Mude a cor
      {members} Convide até **{max_members}** membros
      {swap} Transfira a posse

      Use o painel de cargos boost para gerenciar tudo.
    transferred: |
      {success} Propriedade Transferida!

      Olá, {mention}! A propriedade do cargo boost @{role_name} foi transferida para você no **{server_name}**.

      {pencil} Renomeie e escolha um emoji
      {palette} Mude a cor
      {members} Convide até **{max_members}** membros
      {swap} Transfira a posse

      Use o painel de cargos boost para gerenciar tudo.
    auto_transferred: |
      {success} Propriedade Transferida Automaticamente!

      Olá, {mention}! Como o dono anterior saiu do servidor, a propriedade do cargo boost @{role_name} foi transferida para você no **{server_name}**.

      Use o painel de cargos boost para gerenciar seu cargo.
    auto_created: |
      {success} Você recebeu um Cargo Boost!

      Olá, {mention}! O cargo boost @{role_name} foi criado para você no **{server_name}** porque você deu boost no servidor.

      {pencil} Renomeie e escolha um emoji
      {palette} Mude a cor
      {members} Convide até **{max_members}** membros
      {swap} Transfira a posse

      Use o painel de cargos boost para gerenciar tudo.
    auto_restored: |
      {success} Seu Cargo Boost Voltou!

      Olá, {mention}! Seu cargo boost @{role_name} está ativo de novo no **{server_name}**, incluindo os membros anteriores.

      Use o painel de cargos boost para gerenciar tudo.
    unboost_deleted: |
      {error} Seu cargo boost foi removido

      Olá, {mention}! Seu boost terminou, então o cargo boost @{role_name} foi removido do **{server_name}**.

      Dê boost no servidor de novo e o cargo volta automaticamente, com os membros.
    unboost_removed: |
      {error} Seu cargo boost foi retirado

      Olá, {mention}! Seu boost terminou, então o cargo boost @{role_name} foi retirado de você e dos membros no **{server_name}**. O cargo continua existindo.

      Dê boost no servidor de novo para recebê-lo de volta.
    unboost_kept: |
      {info} Seu boost terminou

      Olá, {mention}! Seu boost terminou, mas o cargo boost @{role_name} continua com você no **{server_name}**.

      Só a equipe do servidor pode removê-lo.
    invite: '{info} **Convite para Cargo Boost!**'
    invite_body: 'Olá, {mention}! Você recebeu um convite para fazer parte de um cargo boost no **{server_name}**.'
    invite_inviter: '{user} Convidado por'
    invite_expires: '{clock} Expira'
    invite_footer: 'Ao aceitar, você receberá o cargo e poderá usá-lo no servidor. Use os botões abaixo para responder!'
    accepted: |
      {success} Convite Aceito!

      O cargo @{role_name} foi adicionado a você com sucesso.

      Para sair do cargo a qualquer momento, use `/boost painel`.
    declined: |
      {info} Convite Recusado

      Você recusou o convite para o cargo @{role_name}.

      O dono do cargo foi notificado sobre sua decisão.
    owner_accepted: |
      {success} Convite Aceito!

      {member_mention} aceitou seu convite e foi adicionado ao cargo @{role_name}!
    owner_declined: |
      {info} Convite Recusado

      {member_mention} recusou seu convite para o cargo @{role_name}.

      Você pode convidar outra pessoa se desejar.
    member_left: |
      {info} Você Saiu do Cargo

      Você saiu do cargo @{role_name} com sucesso.

      O dono do cargo foi notificado.
    owner_member_left: |
      {info} Membro Saiu do Cargo

      {member_mention} saiu do cargo @{role_name}.

      Você pode adicionar outro membro se desejar.
    error: |
      {error} Ops!

      {body}
