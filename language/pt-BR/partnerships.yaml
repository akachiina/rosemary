partnerships:
  command:
    name: parcerias
    description: Gerencia parcerias do servidor
  error_disabled: '{error} Parcerias estão desativadas neste servidor.'
  error_no_channel: '{error} Nenhum canal de parcerias configurado.'
  modal:
    title: Anúncio de parceria
    label: Texto do anúncio
    placeholder: Escreva o anúncio. Use {{rep}} e {{ping_role}} onde quiser.
  edit_modal:
    title: Editar Anúncio de Parceria
    label: Texto do anúncio
    placeholder: Edite o anúncio. Use {{rep}} e {{ping_role}} onde quiser.
  error_not_found: '{error} Sem parceria para {user}.'
  error_not_rep: '{error} Você não representa nenhuma parceria aqui.'
  error_rep_has_partnership: '{error} {user} já representa uma parceria aqui.'
  list_empty: Sem parcerias ainda.
  list_title: Parcerias
  list_line: '- {user} ({days}d restantes){warned}'
  audit_title: Auditoria de Parcerias
  audit_body: 'Expiradas: {expired}

    Órfãs: {orphans}'
  invite_text: '{info} Faça parceria com a gente! Fale com a staff para participar.'
  invite_text_default: Faça parceria com a gente! Fale com {rep} para participar.
  dm:
    added: '{success} Nova Parceria Estabelecida!'
    added_greeting: 'Olá, {mention}! Você foi designado(a) como **representante oficial** da parceria com **{server}**.'
    added_responsibilities: |
      {scroll} **Suas responsabilidades**
      • Manter seu servidor seguro, ativo e acolhedor
      • Seguir as regras de parceria do canal correspondente
      • Representar as duas comunidades com respeito
    added_closing: '{tada} Obrigado por fazer parte desta parceria!'
    added_footer: Sair do servidor ou descumprir as regras pode resultar na perda da parceria. Dúvidas? Fale com a equipe de moderação!
    removed: '{info} Parceria Encerrada'
    removed_greeting: 'Olá, {mention}! Sua parceria com **{server}** foi encerrada pela equipe.'
    removed_hint: '{envelope} Se quiser restabelecer o vínculo, fale com a equipe do servidor para recomeçar o processo.'
    removed_footer: Esta é uma notificação automática da parceria.
    rep_changed: '{info} Você Agora Representa uma Parceria!'
    rep_changed_greeting: 'Olá, {mention}! A parceria com **{server}** agora é representada por você. O anúncio foi atualizado e o cargo de parceiro foi transferido.'
    rep_changed_closing: '{tada} Bem-vindo(a) à parceria!'
    rep_changed_footer: Dúvidas? Fale com a equipe de moderação!
    warning: '{warning} Renovação de Parceria Necessária!'
    warning_greeting: 'Olá, {mention}! Sua parceria com **{server}** está chegando ao fim e precisa ser renovada.'
    warning_how: |
      **Como renovar**
      Use o comando `/parcerias renovar` no servidor antes do prazo acabar.
    warning_deadline: |
      {warning} **Prazo**
      Você tem **{days} dia(s)** para agir.
    warning_footer: Ao expirar, sua mensagem de parceria será deletada e o cargo de parceiro será removido.
    expired: '{info} Parceria Expirada'
    expired_greeting: 'Olá, {mention}! A parceria com **{server}** expirou por falta de renovação e foi removida automaticamente.'
    expired_hint: |
      {refresh} **Quer voltar?**
      Basta falar com a equipe do servidor para refazer o processo de parceria.
    expired_footer: Seu anúncio foi deletado e o cargo de parceiro foi removido.
    expired_admin: '{info} Parceria Expirada'
    expired_admin_greeting: 'Olá, {mention}! A parceria que você adicionou com o representante {rep} expirou por falta de renovação e foi removida de **{server}**.'
    expired_admin_days: 'há {days} dia(s)'
    expired_admin_invite: '{love_letter} Convite para o representante'
    expired_admin_footer: Esta é uma notificação automática. Nenhuma ação adicional foi tomada além da remoção da parceria.
    representative: '{calendar} Representante'
    last_renewed: '{refresh} Última renovação'
  invite: '{server} 🤝'
  success:
    added: '{success} Parceria adicionada para {user}.'
    removed: '{success} Parceria removida de {user}.'
    renewed: '{success} Parceria renovada.'
    invite_posted: '{success} Convite de parceria postado.'
    cleaned: '{success} {count} parceria(s) órfã(s) removidas.'
    edited: '{success} Anúncio de parceria de {user} atualizado.'
    edited_rep: '{success} Anúncio atualizado e representação transferida de {user} para {rep}.'
  logs:
    added:
      title: '{plus} Parceria Adicionada'
      description: '{author} adicionou parceria para {user}.'
    removed:
      title: '{minus} Parceria Removida'
      description: '{author} removeu a parceria de {user}.'
    edited:
      title: '{pencil} Parceria Editada'
    renewed:
      title: '{refresh} Parceria Renovada'
      description: '{user} renovou a parceria.'
    warning_sent:
      title: '{warning} Aviso de Parceria'
      description: '{user} foi avisado ({days}d atrasado).'
    expired:
      title: '{clock} Parceria Expirada'
      description: Parceria de {user} expirou. {ping}
    invite_posted:
      title: '{love_letter} Convite Postado'
      description: '{author} postou o convite de parceria.'
    orphans_cleaned:
      title: '{trash} Órfãs Removidas'
      description: '{author} removeu {count} parceria(s) órfã(s).'
partnerships_admin:
  command:
    name: parcerias_admin
    description: '[ADMIN] Ferramentas de parceria para administradores'
partnerships_admin_add:
  command:
    name: adicionar
    description: '[ADMIN] Adiciona uma parceria'
    options:
      member:
        description: Representante da parceria
partnerships_admin_audit:
  command:
    name: auditar
    description: '[ADMIN] Audita parcerias sem agir'
partnerships_admin_clean:
  command:
    name: limpar
    description: '[ADMIN] Remove parcerias órfãs'
partnerships_admin_edit:
  command:
    name: editar
    description: '[ADMIN] Edita o anúncio e/ou o representante'
    options:
      member:
        description: Representante da parceria
      new_rep:
        description: Novo representante (omita para manter o atual)
partnerships_admin_invite:
  command:
    name: convidar
    description: '[ADMIN] Posta o texto de convite'
    options:
      channel:
        description: 'Canal para publicar o convite (padrão: atual)'
      representative:
        description: 'Representante mencionado via {{rep}} (padrão: você)'
partnerships_admin_list:
  command:
    name: listar
    description: '[ADMIN] Lista parcerias'
partnerships_admin_remove:
  command:
    name: remover
    description: '[ADMIN] Remove uma parceria'
    options:
      member:
        description: Representante da parceria
partnerships_renew:
  command:
    name: renovar
    description: Renova seu anúncio de parceria
