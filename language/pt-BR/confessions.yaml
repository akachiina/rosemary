  review:
    title: Confissão (#{confession_number}) · Revisão
    author: '{user} escreveu esta confissão'
  response:
    title: 'Confissão #{confession_number}-{reply_index}'
    parent: em resposta a {parent_ref}
    parent_ref: '#{confession_number}-{parent_index}'
    parent_op: em resposta a {parent_ref} (autor da confissão)
  thread_name: 'Respostas da confissão #{confession_number}'
  buttons:
    new: Escrever confissão
    reply: Responder
    approve: Aprovar
    deny: Recusar
    ban: Banir
  dm:
    key_share: '{lock} **Sua parte da chave**\n• Servidor: **{guild}**\n• Sua parte: `{share}`\n• Guarde esta DM: {threshold} de {total} partes abrem um selado.'
    approved: '{check} Sua confissão **#{confession_number}** foi aprovada!'
    rejected: '{error} Sua confissão **#{confession_number}** foi recusada.'
    reason: 'Motivo: {reason}'
    response: '{envelope} Nova resposta anônima **#{confession_number}-{reply_index}**:'
    response_parent: '{envelope} Nova resposta anônima **#{confession_number}-{reply_index}** {parent_line}:'
    jump: Ir para a thread
    banned: '{ban} **Você foi banido das confissões**

      • **{scroll} Motivo:** {reason}'
  no_reason: Sem motivo informado.
  review_approved: '{success} Confissão postada.'
  review_denied: '{success} Confissão recusada.'
  sent: '{success} Sua confissão foi postada!'
  sent_review: '{success} Sua confissão foi enviada para revisão!'
  sent_sealed: '• **Autor selado:** X25519 + XSalsa20-Poly1305 · chave `{fingerprint}` · id `{key_id}`'
  sent_token: '• **Sua chave de reivindicação:** {token} (guarde; ela prova que a confissão é sua)'
  sent_repo: '• **Código:** `{repo}`'
  replied: '{success} Sua resposta anônima foi postada!'
  banned_confirm: '{success} {user} foi banido das confissões.'
  unbanned_confirm: '{success} {user} pode confessar de novo.'
  already_banned: '{warning} {user} já está banido.'
  not_banned: '{warning} {user} não está banido.'
  error_disabled: '{error} Confissões estão desativadas neste servidor.'
  error_no_channel: '{error} Nenhum canal de confissões configurado.'
  error_no_review: '{error} Nenhum canal de revisão configurado.'
  error_banned: '{error} Você está banido das confissões.'
  error_empty: '{error} Sua confissão não pode estar vazia.'
  error_too_long: '{error} Sua confissão é longa demais.'
  error_bad_image: '{error} Anexe um arquivo de imagem.'
  error_image_too_large: '{error} A imagem é grande demais (limite de 8 MB).'
  error_gone: '{error} Essa confissão não existe mais.'
  error_not_found: '{error} Confissão #{confession_number} não encontrada.'
  error_staff_only: '{error} Só a staff pode fazer isso.'
  error_failed: '{error} Não foi possível postar. Tente de novo.'
  error_thread: '{error} Não foi possível abrir a thread de discussão.'
  banned_list:
    title: Banidos das confissões
    empty: Nenhum membro banido.
    line: '- {user}'
confess_ban:
  command:
    name: banir
    description: '[ADMIN] Bane um membro das confissões'
    options:
      member:
        description: Membro a banir
      reason:
        description: Motivo mostrado ao membro
confess_banned:
  command:
    name: banidos
    description: '[ADMIN] Lista membros banidos das confissões'
confess_panel:
  command:
    name: painel
    description: '[ADMIN] Posta o painel de confissões'
confess_reply:
  command:
    name: responder
    description: Responda anonimamente a uma confissão
    options:
      number:
        description: Número da confissão
confess_send:
  command:
    name: enviar
    description: Envie uma confissão anônima
confess_unban:
  command:
    name: desbanir
    description: '[ADMIN] Desbane um membro das confissões'
    options:
      member:
        description: Membro a desbanir
confessions:
  logs:
    approved:
      title: '{check} Confissão aprovada'
      description: '{moderator} aprovou a confissão **#{confession_number}**.'
    denied:
      title: '{error} Confissão recusada'
      description: '{moderator} recusou a confissão **#{confession_number}** ({reason}).'
    replied:
      title: '{envelope} Resposta de confissão'
      description: Resposta **#{confession_number}-{reply_index}** postada.
    banned:
      title: '{ban} Ban de confissão'
      description: '{moderator} baniu {user} das confissões ({reason}).'
