confess:
  command:
    name: confissão
    description: Envie confissões anônimas
  panel:
    title: 'Confesse com a Rosemary'
    text: 'Clique em **Escrever confissão** e conte o que quiser. É anônimo: o autor fica selado e nem o dono do bot consegue abrir.'
    posted: '{success} Painel de confissões postado.'
