trap:
  reason: Caiu no canal armadilha
  notice:
    text: 'Este canal é uma **armadilha** de moderação do {server}.


      ### {ban} Não envie mensagens aqui

      > Este canal existe para capturar contas de spam, bots e RAID. Quem enviar mensagem aqui perde a mensagem na hora e sofre uma consequência.


      **{gear} Consequência configurada:** {action}


      {envelope} Caiu aqui por engano? Fale com a equipe de moderação.'
    action:
      none: A mensagem é apagada.
      kick: Expulsão do servidor.
      softban: Expulsão com apagamento das mensagens recentes.
      ban: Banimento do servidor.
  failure:
    no_ban: O bot não tem permissão de banir (ou o cargo da vítima está acima do dele).
    no_kick: O bot não tem permissão de expulsar.
    no_hierarchy: O cargo da vítima está acima do cargo do bot.
    no_unban: 'O banimento funcionou, mas o desbanimento do softban falhou: a vítima continua banida.'
  logs:
    failed:
      title: '{error} Armadilha Falhou'
      description: '**{people} Alvo:** {user}\n**{gear} Consequência:** {action}\n**{scroll} Motivo:** {reason}'
  dm:
    text: 'Você postou no canal armadilha de **{server}** e a mensagem foi removida.


      {action}


      Esta é uma notificação automática. Dúvidas? Fale com a equipe de moderação.'
    action:
      none: Sua mensagem foi apagada.
      kick: Você foi expulso(a) do servidor.
      softban: Você foi expulso(a) e suas mensagens recentes foram apagadas. Pode voltar com um novo convite.
      ban: Você foi banido(a) do servidor e suas mensagens recentes foram apagadas.
  audit:
    applied: Consequência aplicada
    skipped: Falha ao aplicar (permissão ou hierarquia)
    action:
      none: Só apagar a mensagem
      kick: Expulsão
      softban: Softban
      ban: Banimento
    user_label: Alvo
    action_label: Consequência
    reason_label: Motivo
