bump:
  command:
    name: bump
    description: Placar de bump do Disboard
  messages:
    ping_thank_you: 'Obrigado pelo bump, {mention}!'
    ping_leaderboard: 'Parabéns, {winner_mention}!'
    anti_camping: O canal foi bloqueado temporariamente. O bump estará disponível em instantes!
    thank_you_title: '{tada} Bump Registrado!'
    thank_you_description: 'Muito obrigada pelo bump, {mention}! Sua dedicação mantém o servidor brilhando. {cup}


      **{clock} Próximo bump:** <t:{next_bump_timestamp}:R>

      **{hourglass} Lembrete:** volto para te avisar em **{cooldown}!**


      {trophy} Use `/bump leaderboard` para ver o placar e disputar o **Bump-MVP**!

      '
    reminder_title: '{clock} Hora do Bump!'
    reminder_description: 'Já se passou o cooldown de {cooldown} desde o último bump!


      **{rocket} Sua vez de ajudar:** use `/bump` e ganhe um ponto no placar!

      '
    leaderboard_title: '{trophy} Placar Semanal de Bumps'
    leaderboard_description: 'Confira quem mais ajudou o servidor esta semana!


      **{calendar} Período:** <t:{start_timestamp}:d> até <t:{end_timestamp}:d>

      **{hourglass} A semana termina em:** <t:{next_reset_timestamp}:R>

      **{crown} Vencedor:** {@winner_mention} com **{winner_count}** bumps!


      **{gift} Prêmio:** Cargo **{role_name}** customizável por 1 semana!

      Use `/boost painel` para personalizar nome, cor, emoji e convidar membros.


      {leaderboard_list}

      '
    leaderboard_line: '{medal} **{position}º** · {user_mention} **{bump_count}** bumps'
    no_bumps_title: '{trophy} Placar Semanal de Bumps'
    no_bumps_description: 'Ninguém deu bump esta semana! {cry}


      **{rocket} Seja o primeiro:** use `/bump` no canal de bump e ganhe um ponto no placar!

      '
    no_bumps_you: '{bar_chart} Você ainda não deu nenhum bump esta semana! Use `/bump` no canal de bump.'
  dm:
    winner_new: |
      Você é o Bump-MVP da Semana!

      Olá, {mention}! Sua dedicação manteve o servidor brilhando. Muito obrigada!

      • **{bar_chart} Bumps na semana:** {bump_count}
      • **{trophy} Cargo:** {role_name}

      {palette} **Personalize seu cargo**
      Use `/boost painel` para customizar:
      • {pencil} Nome e emoji
      • {palette} Cor
      • {members} Convidar até **{max_members}** membros

      Suas customizações são salvas e voltam caso você ganhe novamente!

      Aproveite até o próximo reset.
    winner_again: |
      Bump-MVP mais uma vez!

      Olá, {mention}! Você reconquistou o título. Sua dedicação é admirável!

      • **{bar_chart} Bumps na semana:** {bump_count}
      • **{trophy} Total de vitórias:** {total_wins}

      Seu cargo **{role_name}** foi restaurado com suas customizações anteriores!

      Continue sendo incrível.
    winner_lost: |
      Seu período como Bump-MVP terminou

      Olá, {mention}! Esta semana outro membro conquistou o título. Não desanime!

      • **{bar_chart} Seus bumps:** {bump_count}
      • **{crown} Novo vencedor:** {winner_mention}

      Suas customizações foram salvas e voltam se você ganhar novamente!

      Continue dando bumps e reconquiste o trono!
  logs:
    bump_recorded:
      title: '{rocket} Bump Detectado'
      description: Bump efetuado por {user} no canal {channel}.
    reminder_sent:
      title: '{clock} Lembrete Enviado'
      description: Lembrete de bump enviado no canal {channel}.
    channel_locked:
      title: '{lock} Canal Bloqueado'
      description: Canal {channel} bloqueado temporariamente (anti-camping).
    channel_unlocked:
      title: '{unlock} Canal Desbloqueado'
      description: Canal {channel} desbloqueado.
    schedule_opened:
      title: '{unlock} Canal de Bump Aberto'
      description: Canal {channel} aberto pelo horário.
    schedule_closed:
      title: '{lock} Canal de Bump Fechado'
      description: Canal {channel} fechado pelo horário.
    week_reset:
      title: '{refresh} Semana de Bump Resetada'
      description: 'O ranking semanal foi resetado.

        Novo MVP: {winner}

        Bumps: {bumps}'
    no_winner:
      title: '{bar_chart} Semana Resetada (Sem MVP)'
      description: A semana foi resetada, mas ninguém realizou bumps.
    leaderboard_posted:
      title: '{trophy} Placar Postado'
      description: O placar semanal foi postado no canal {channel}.
    no_bumps_posted:
      title: '{bar_chart} Placar Vazio Postado'
      description: Nenhum bump registrado esta semana. O card de ‘sem dados’ foi postado no canal {channel}.
    week_reset_manual:
      title: '{refresh} Semana Resetada Manualmente'
      description: A semana de bumps foi resetada manualmente por {author}.
    bumps_added:
      title: '{pencil} Bumps de Teste Adicionados'
      description: '{author} adicionou {count} bump(s) de teste para {user} (total na semana: {total}).'
  error_disabled: '{error} O sistema de bump está desativado neste servidor.'
  schedule:
    open_message_default: O canal de bump está aberto! {ping_role} Use `/bump` para ajudar o servidor!
    close_message_default: O canal de bump está fechado. Voltamos às 06:00!
  anti_camping:
    message_default: O canal foi bloqueado temporariamente. O bump estará disponível em instantes!
  error_no_channel: '{error} O canal de bump não está configurado. Configure-o em `/configuracoes`.'
  error_no_role: '{error} O cargo de Bump-MVP não está configurado.'
  error_role_not_found: '{error} O cargo de vencedor configurado não foi encontrado no servidor.'
  error_leaderboard_disabled: '{error} O placar semanal de bumps está desativado.'
  test:
    no_bumps: '{bar_chart} Nenhum bump registrado esta semana; o placar não foi postado.'
    simulated: '{success} Bump simulado com sucesso.'
    reminder_sent: '{success} Lembrete enviado com sucesso.'
  status:
    card_title: '{rocket} Status do Bump'
    state_on: Sim
    state_off: Não
    enabled: '**{success} Ativo:** {enabled}'
    channel_locked: '**{lock} Canal bloqueado:** {locked}'
    reminder_sent: '**{clock} Lembrete enviado:** {sent}'
    last_bump: '**{rocket} Último bump:** <t:{timestamp}:R>'
    last_bump_na: '**{rocket} Último bump:** N/A'
    next_reminder: '**{clock} Próximo lembrete:** {next}'
    none: N/A
    last_reset: '**{refresh} Último reset:** {when} por {author} ({reason})'
    last_reset_na: '**{refresh} Último reset:** N/A'
    reset_actor_automatic: automático
    reset_reason:
      scheduler: reset automático
      test_leaderboard: teste forçado
      reset_week_command: comando manual
      settings_reset: painel settings
      unknown: desconhecido
  success:
    leaderboard_posted: '{success} Placar semanal postado com sucesso!'
    week_reset: '{success} Semana de bumps resetada com sucesso!'
    bumps_added: '{success} {count} bump(s) adicionado(s) para {user_mention}! Total na semana: {total}.'
  stats:
    title: '{bar_chart} Suas Estatísticas de Bumps'
    this_week: '**{calendar} Esta semana:**

      **{trophy} Posição no placar:** #{position}

      **{rocket} Bumps:** {bumps}

      **{members} Total do servidor:** {total_bumps} bumps

      '
    history: '**{crown} Histórico:**

      **{trophy} Vitórias:** {wins}

      '
    week_start: '**{calendar} Semana iniciada em:** <t:{week_start_ts}:d>'
    week_end: '**{hourglass} A semana termina em:** <t:{next_reset_ts}:R>'
bump_admin:
  command:
    name: bump_admin
    description: '[ADMIN] Ferramentas de Bump para administradores'
bump_admin_add_test:
  command:
    name: add_test
    description: '[ADMIN] Adiciona bumps de teste para um usuário'
    options:
      user:
        description: Membro para adicionar bumps
      count:
        description: Número de bumps a adicionar
bump_admin_reset_week:
  command:
    name: reset_week
    description: '[ADMIN] Reseta a semana de bump manualmente'
bump_admin_test_leaderboard:
  command:
    name: test_leaderboard
    description: '[ADMIN] Força o cálculo do placar semanal'
bump_leaderboard:
  command:
    name: leaderboard
    description: Mostra o placar semanal de bumps
bump_stats:
  command:
    name: stats
    description: Mostra suas estatísticas de bumps
bump_status:
  command:
    name: status
    description: '[ADMIN] Mostra o status do sistema de bump'
bump_test:
  command:
    name: test
    description: '[ADMIN] Simula um bump para testar o sistema'
bump_test_reminder:
  command:
    name: test_reminder
    description: '[ADMIN] Envia o lembrete de bump imediatamente'
