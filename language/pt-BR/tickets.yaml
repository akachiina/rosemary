    title: Ticket aberto
    text: '{user}, descreva seu problema. A staff vai te atender ({type}).'
  closed_done: '{success} Ticket fechado.'
  reopened_done: '{success} Ticket reaberto.'
  deleted_done: '{success} Ticket excluído.'
  transcript_sent: '{success} Transcrição enviada ao canal de log.'
  transcript_failed: '{error} Nenhum canal de log para transcrições.'
  logs:
    opened:
      title: '{envelope} Ticket Aberto'
      description: '{user} abriu um ticket **{type}** em {channel}.'
    closed:
      title: '{lock} Ticket Fechado'
      description: Ticket {channel} foi fechado.
    reopened:
      title: '{unlock} Ticket Reaberto'
      description: Ticket {channel} foi reaberto.
    deleted:
      title: '{trash} Ticket Excluído'
      description: Ticket {channel} foi excluído.
    transcript:
      title: '{scroll} Transcrição de Ticket'
      description: Transcrição de {channel} (pedida por {moderator}).
tickets_admin:
  command:
    name: tickets_admin
    description: '[ADMIN] Ferramentas de Ticket para administradores'
