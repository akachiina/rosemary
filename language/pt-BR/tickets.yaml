    placeholder: Escolha um tipo de ticket...
  types:
    report:
      label: Denúncia
      description: Denunciar um membro ou problema
      prefix: denuncia
    confidential:
      label: Confidencial
      description: Assunto privado com a staff
      prefix: privado
    partnership:
      label: Parceria
      description: Pedidos de parceria
      prefix: parceria
    boost:
      label: Benefícios boost
      description: Dúvidas sobre cargos boost
      prefix: boost
  confirm: Confirmar
  cancel: Cancelar
  cancelled: Cancelado.
  confirm_title: Abrir um ticket?
  confirm_text: Abrir um ticket de **{type}**?
  created_confirm: '{success} Ticket aberto: {channel}'
  close: Fechar
  transcript: Transcrição
  reopen: Reabrir
  delete: Excluir
