  review:
    title: Confession (#{confession_number}) · Review
    author: '{user} wrote this confession'
  response:
    title: 'Confession #{confession_number}-{reply_index}'
    parent: in reply to {parent_ref}
    parent_ref: '#{confession_number}-{parent_index}'
    parent_root_ref: '#{confession_number}'
    parent_op: in reply to {parent_ref} (confession author)
