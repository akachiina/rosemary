  error_no_review: '{error} No confessions review channel configured.'
  error_banned: '{error} You are banned from confessions.'
  error_empty: '{error} Your confession cannot be empty.'
  error_too_long: '{error} Your confession is too long.'
  error_bad_image: '{error} Please attach an image file.'
  error_image_too_large: '{error} The image is {size}, but the limit is {max_mb} MB.'
  error_gone: '{error} That confession no longer exists.'
  error_not_found: '{error} Confession #{confession_number} not found.'
  error_staff_only: '{error} Only staff can do that.'
  error_failed: '{error} Could not post. Try again.'
  error_thread: '{error} Could not open the discussion thread.'
  banned_list:
    title: Banned from confessions
    empty: No banned members.
    line: '- {user}'
confess_ban:
  command:
    name: ban
    description: '[ADMIN] Ban a member from confessions'
    options:
      member:
        description: Member to ban
      reason:
        description: Reason shown to the member
confess_banned:
  command:
    name: banned
    description: '[ADMIN] List members banned from confessions'
confess_panel:
  command:
    name: panel
    description: '[ADMIN] Post the confession panel'
confess_reply:
  command:
    name: reply
    description: Reply anonymously to a confession
    options:
      number:
        description: Confession number
confess_send:
  command:
    name: send
    description: Send an anonymous confession
confess_unban:
  command:
    name: unban
    description: '[ADMIN] Unban a member from confessions'
    options:
      member:
        description: Member to unban
confessions:
  logs:
    approved:
      title: '{check} Confession Approved'
      description: '{moderator} approved confession **#{confession_number}**.'
    denied:
      title: '{error} Confession Denied'
      description: '{moderator} denied confession **#{confession_number}** ({reason}).'
    replied:
      title: '{envelope} Confession Reply'
      description: Reply **#{confession_number}-{reply_index}** posted.
    banned:
      title: '{ban} Confession Ban'
      description: '{moderator} banned {user} from confessions ({reason}).'
