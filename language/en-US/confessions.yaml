confess:
  command:
    name: confess
    description: Send anonymous confessions
  modal:
    title: Send a confession
    label: Your confession
    placeholder: Write your confession here...
    image_label: Image (optional)
    image_description: Attach one image with your confession.
  reply_modal:
    title: Reply anonymously
    label: Your reply
    placeholder: Write your anonymous reply...
    image_label: Image (optional)
    image_description: Attach one image with your reply.
  reason_modal:
    title: Reason
    label: Reason (optional)
    placeholder: Why? (optional, shown to the author)
  alias: Anonymous {seed}
  card:
    title: Confession (#{confession_number})
  identity:
    aliases:
    - Apple
    - Banana
    - Strawberry
    - Grape
    - Mango
    - Pineapple
    - Watermelon
    - Cherry
    - Orange
    - Lemon
    - Peach
    - Kiwi
    - Coconut
    - Fig
    - Pomegranate
    - Plum
    - Pear
    - Papaya
    - Guava
    - Passion Fruit
    - Raspberry
    - Blackberry
    - Blueberry
    - Lychee
    - Physalis
    - Star Fruit
    - Jabuticaba
    - Acerola
    - Pitanga
    - Cashew
    - Avocado
    - Jackfruit
    - Breadfruit
    - Tamarind
    - Date
    - Persimmon
    - Nectarine
    - Apricot
    - Redcurrant
    - Cranberry
    - Melon
    - Bacuri
    - Buriti
    - Cupuacu
    - Acai
    - Guarana
    - Sapodilla
    - Abiu
    - Rollinia
    - Soursop
    - Sugar Apple
    - Atemoya
    - Siriguela
    - Umbu
    - Licuri
    - Macauba
    - Pejibaye
    - Pequi
    - Jenipapo
  review:
    title: Confession (#{confession_number}) · Review
    author: '{user} wrote this confession'
  response:
    title: Confession (#{confession_number}-{reply_index})
    parent: in reply to {parent_ref}
    parent_ref: '#{confession_number}-{parent_index}'
    parent_op: in reply to {parent_ref} (confession author)
  thread_name: 'Replies to confession #{confession_number}'
  buttons:
    new: Write confession
    reply: Reply
    approve: Approve
    deny: Deny
    ban: Ban
  dm:
    approved: '{check} Your confession **#{confession_number}** was approved!'
    rejected: '{error} Your confession **#{confession_number}** was denied.'
    reason: 'Reason: {reason}'
    response: '{envelope} New anonymous reply **#{confession_number}-{reply_index}**:'
    response_parent: '{envelope} New anonymous reply **#{confession_number}-{reply_index}** {parent_line}:'
    jump: Go to the thread
    banned: '{ban} **You were banned from confessions**

      • **{scroll} Reason:** {reason}'
  no_reason: No reason given.
  review_approved: '{success} Confession posted.'
  review_denied: '{success} Confession denied.'
  sent: '{success} Your confession was posted!'
  sent_review: '{success} Your confession was sent for review!'
  sent_sealed: '• **Author sealed:** X25519 + XSalsa20-Poly1305 · key `{fingerprint}`'
  sent_token: '• **Your claim key:** {token} (keep it; it proves the confession is yours)'
  sent_repo: '• **Code:** `{repo}`'
  replied: '{success} Your anonymous reply was posted!'
  banned_confirm: '{success} {user} was banned from confessions.'
  unbanned_confirm: '{success} {user} can confess again.'
  already_banned: '{warning} {user} is already banned.'
  not_banned: '{warning} {user} is not banned.'
  error_disabled: '{error} Confessions are disabled on this server.'
  error_no_channel: '{error} No confessions channel configured.'
  error_no_review: '{error} No confessions review channel configured.'
  error_banned: '{error} You are banned from confessions.'
  error_empty: '{error} Your confession cannot be empty.'
  error_too_long: '{error} Your confession is too long.'
  error_bad_image: '{error} Please attach an image file.'
  error_image_too_large: '{error} The image is too large (limit 8 MB).'
  error_gone: '{error} That confession no longer exists.'
  error_not_found: '{error} Confession #{confession_number} not found.'
  error_staff_only: '{error} Only staff can do that.'
  error_failed: '{error} Could not post. Try again.'
  error_thread: '{error} Could not open the discussion thread.'
  banned_list:
    title: Banned from confessions
    empty: No banned members.
    line: '- {user}'
confess_ban:
  command:
    name: ban
    description: '[ADMIN] Ban a member from confessions'
    options:
      member:
        description: Member to ban
      reason:
        description: Reason shown to the member
confess_banned:
  command:
    name: banned
    description: '[ADMIN] List members banned from confessions'
confess_reply:
  command:
    name: reply
    description: Reply anonymously to a confession
    options:
      number:
        description: Confession number
confess_send:
  command:
    name: send
    description: Send an anonymous confession
confess_unban:
  command:
    name: unban
    description: '[ADMIN] Unban a member from confessions'
    options:
      member:
        description: Member to unban
confessions:
  logs:
    approved:
      title: '{check} Confession Approved'
      description: '{moderator} approved confession **#{confession_number}**.'
    denied:
      title: '{error} Confession Denied'
      description: '{moderator} denied confession **#{confession_number}** ({reason}).'
    replied:
      title: '{envelope} Confession Reply'
      description: Reply **#{confession_number}-{reply_index}** posted.
    banned:
      title: '{ban} Confession Ban'
      description: '{moderator} banned {user} from confessions ({reason}).'
