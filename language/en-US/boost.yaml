boost:
  command:
    name: boost
    description: Boost roles panel
  titles:
    home: Boost Roles
    my_roles: My Boost Roles
    pending_invites: Pending Invites
    register: Register a Role
    register_owner: Who will be the owner?
    leave: Leave a Role
    leave_confirm: Leave Role?
    management_panel: 'Managing: {role_name}'
    select_color: Choose a Color
    manage_members: Members of {role_name}
    invites: Invites for {role_name}
    invite_target: Invite a Member
    transfer_target: Transfer Ownership
    remove_confirm: Remove Boost Role?
    admin_panel: Boost Roles | Admin
    remove: Remove a Role
    transfer: Transfer a Role
    list_all: All Boost Roles
  descriptions:
    user_panel: Here are the server's boost roles. Manage yours, join or leave.
    as_owner: You own this role
    as_member: You are a member
    my_roles_empty: You do not own or belong to any boost role yet.
    pending_invites_empty: You have no pending invites.
    pending_invite_entry: '{invitee} · expires {expires}'
    register: Pick the role you own to register it as your boost role. Then you will choose who becomes the owner.
    register_owner: Pick who will be the owner of the role {role}. They will receive a private message with the instructions.
    remove: Pick a boost role to remove.
    transfer: Pick a boost role to transfer.
    select_color: Pick a color for the role.
    leave: Pick one of the roles you belong to in order to leave it.
    leave_empty: You are not a member of any boost role.
    manage_hint: Use the buttons below to customize your role.
    members_count: '{count}/{max_members} members'
    manage_members: Manage the members of your boost role (max {max_members}).
    members_empty: No members yet. Invite someone with the button below.
    owner: You are the owner of this role.
    dm_hint: The member will receive an invite in their private messages.
    transfer_hint: Pick the new owner. They will be notified by private message.
    new_owner: The new owner will receive a private message.
    confirm_leave: Are you sure you want to leave {role}? The owner will be notified.
    confirm_removal: Are you sure you want to remove {role} from the boost system?
    remove_hint: You can keep the Discord role or delete it.
    guide_admin: Register, transfer or remove boost roles below.
    stats: '{roles} role(s) · {members} member(s)'
    role_entry: 'Owner: {owner} · Members: {members}'
    no_roles: No boost roles registered yet.
  buttons:
    my_roles: My roles
    invites: Invites
    register: Register
    leave_role: Leave
    close: Close
    back: Back
    previous: Previous
    next: Next
    cancel: Cancel
    cancel_invite: Cancel
    confirm: Confirm
    manage_roles: Manage
    rename: Rename
    change_color: Color
    emoji: Emoji
    icon: Icon
    manage_members: Members
    transfer: Transfer
    remove: Remove
    remove_member: Remove
    custom_color: Custom color
    add_member: Add
    add_by_id: By ID
    invite_member: Invite Member
    list_all: List all
    accept_invite: Accept
    decline_invite: Decline
    delete_role_yes: Delete role
    delete_role_no: Keep role
  colors:
    pink: Pastel Pink
    peach: Pastel Peach
    yellow: Pastel Yellow
    green: Pastel Green
    blue: Pastel Blue
    lavender: Pastel Lavender
    beige: Pastel Beige
    gray: Light Gray
    white: Soft White
  placeholders:
    select_role: Choose a role...
    select_color: Choose a color...
    select_member: Choose a member...
  modals:
    add_by_id:
      title: Add by ID
      role_label: Role ID
      role_placeholder: Paste the role ID...
    rename:
      title: Rename Role
      label: New name
      placeholder: Type the new role name...
    emoji:
      title: Role Emoji
      label: Emoji
      placeholder: Use a single emoji...
    icon:
      title: Role Icon
      label: Upload an image
      description: The image will become the role icon (requires Level 2 boost).
    custom_color:
      title: Custom Color
      label: Hex code
      placeholder: '#FF5733 or FF5733'
    add_member:
      title: Add Member
      label: User
      placeholder: '@user or ID'
    transfer:
      title: Transfer Ownership
      label: New owner
      placeholder: User ID
    register_owner:
      title: Role Owner
      label: New owner
      placeholder: User ID
  dm:
    registered: 'You received a Boost Role!

      Hello, {mention}! The boost role @{role_name} was registered for you on **{server_name}**.


      {pencil} Rename and pick an emoji

      {palette} Change the color

      {members} Invite up to **{max_members}** members

      {swap} Transfer ownership


      Use the boost roles panel to manage everything.

      '
    transferred: 'Ownership Transferred!

      Hello, {mention}! Ownership of the boost role @{role_name} was transferred to you on **{server_name}**.


      {pencil} Rename and pick an emoji

      {palette} Change the color

      {members} Invite up to **{max_members}** members

      {swap} Transfer ownership


      Use the boost roles panel to manage everything.

      '
    auto_transferred: 'Ownership Transferred Automatically!

      Hello, {mention}! Since the previous owner left the server, ownership of the boost role @{role_name} was transferred to you on **{server_name}**.


      Use the boost roles panel to manage your role.

      '
    auto_created: 'You received a Boost Role!

      Hello, {mention}! The boost role @{role_name} was created for you on **{server_name}** because you boosted the server.


      {pencil} Rename and pick an emoji

      {palette} Change the color

      {members} Invite up to **{max_members}** members

      {swap} Transfer ownership


      Use the boost roles panel to manage everything.

      '
    auto_restored: 'Your Boost Role is Back!

      Hello, {mention}! Your boost role @{role_name} is active again on **{server_name}**, including its previous members.


      Use the boost roles panel to manage everything.

      '
    unboost_deleted: 'Your boost role was removed

      Hello, {mention}! Your boost ended, so the boost role @{role_name} was removed from **{server_name}**.

      Boost the server again and the role comes back automatically, with its members.

      '
    unboost_removed: 'Your boost role was taken away

      Hello, {mention}! Your boost ended, so the boost role @{role_name} was taken away from you and its members on **{server_name}**. The role still exists.

      Boost the server again to receive it back.

      '
    unboost_kept: 'Your boost ended

      Hello, {mention}! Your boost ended, but the boost role @{role_name} stays with you on **{server_name}**.

      Only the server staff can remove it.

      '
    invite: 'Boost Role Invite!

      Hello, {mention}! You have been invited to join a boost role on **{server_name}**.


      > **{tag} Role:** @{role_name}

      > **{user} Invited by:** {inviter_mention}

      > **{clock} Expires:** {expires}


      By accepting, you will receive the role and can use it on the server. Use the buttons below to reply!

      '
    accepted: 'Invite Accepted!

      The role @{role_name} was added to you successfully.

      To leave the role at any time, use `/boost panel`.

      '
    declined: 'Invite Declined

      You declined the invite for the role @{role_name}.

      The role owner was notified about your decision.

      '
    owner_accepted: 'Invite Accepted!

      {member_mention} accepted your invite and was added to the role @{role_name}!

      '
    owner_declined: 'Invite Declined

      {member_mention} declined your invite for the role @{role_name}.

      You can invite someone else if you wish.

      '
    member_left: 'You Left the Role

      You left the role @{role_name} successfully.

      The role owner was notified.

      '
    owner_member_left: 'Member Left the Role

      {member_mention} left the role @{role_name}.

      You can add another member if you wish.

      '
    error: 'Oops!

      {body}

      '
  emoji:
    owner: Owner
    members: Members
    user: User
    roles: Roles
  success:
    role_registered: '{success} The role {role} was registered!'
    role_removed: '{success} The boost role was removed from the system.'
    ownership_transferred: '{success} Ownership of {role} was transferred!'
    role_renamed: '{success} Role renamed from **{old}** to **{new}**.'
    color_changed: '{success} Role color updated!'
    emoji_set: '{success} Role emoji set to {emoji}.'
    icon_set: '{success} Role icon updated!'
    member_added: '{success} {member} joined {role}.'
    member_removed: '{success} {member} was removed from the role.'
    invite_sent: '{success} Invite sent to {member}.'
    invite_cancelled: '{success} Invite cancelled.'
    left_role: '{success} You left {role}.'
  errors:
    role_already_registered: '{error} This role is already registered.'
    role_not_found: '{error} Role not found.'
    role_not_registered: '{error} This role is not registered as a boost role.'
    forbidden_manage_role: '{error} I don''t have permission to edit this role.'
    forbidden_add_role: '{error} I don''t have permission to add this role.'
    forbidden_remove_role: '{error} I don''t have permission to remove this role.'
    generic_error: '{error} Something went wrong. Try again.'
    empty_name: '{error} The role name cannot be empty.'
    invalid_emoji: '{error} Invalid emoji. Use a single valid emoji.'
    requires_boost_level_2: '{error} This server needs Boost Level 2 for role emojis and icons.'
    invalid_image: '{error} Invalid image. Upload a PNG, JPG or GIF.'
    image_download_failed: '{error} Could not download the image.'
    icon_too_large: '{error} The image is too large (limit 1 MB).'
    invalid_hex_color: '{error} Invalid color. Use hex format (e.g. #FF5733).'
    member_not_found: '{error} Member not found.'
    member_is_owner: '{error} The owner already has the role automatically.'
    member_already_added: '{error} This member is already in the role.'
    member_already_invited: '{error} This member already has a pending invite.'
    max_members_reached: '{error} This role reached its limit of {max_members} members.'
    max_pending_invites: '{error} This role has {max_invites} pending invites already.'
    cannot_leave_as_owner: '{error} You are the owner. Transfer ownership instead.'
    bot_not_allowed: '{error} Bots cannot own boost roles.'
    dm_failed: '{error} Could not send the private message.'
    invite_not_found: '{error} Invite not found.'
    invite_not_for_you: '{error} This invite belongs to another user.'
    invite_expired: '{error} This invite has expired.'
    invite_invalid_old: '{error} This invite is no longer valid.'
  logs:
    register:
      title: '{register} Boost Role Registered'
      description: '**{tag} Role:** {role}

        **{people} Owner:** {owner}

        **{gear} Registered by:** {actor}'
    remove:
      title: '{trash} Boost Role Removed'
      description: '**{tag} Role:** {role}

        **{people} Owner:** {owner}

        **{gear} Removed by:** {actor}

        **{trash} Role deleted:** {deleted}'
    transfer:
      title: '{swap} Ownership Transferred'
      description: '**{tag} Role:** {role}

        **{people} Previous owner:** {old_owner}

        **{people} New owner:** {new_owner}

        **{gear} Transferred by:** {actor}'
    rename:
      title: '{pencil} Role Renamed'
      description: '**{tag} Role:** {role}

        **{pencil} From:** {old_name}

        **{pencil} To:** {new_name}

        **{gear} By:** {actor}'
    color_change:
      title: '{palette} Color Changed'
      description: '**{tag} Role:** {role}

        **{palette} New color:** {new_color}

        **{gear} By:** {actor}'
    emoji_change:
      title: '{tag} Emoji Changed'
      description: '**{tag} Role:** {role}

        **{frame} New emoji:** {emoji}

        **{gear} By:** {actor}'
    icon:
      title: '{frame} Icon Changed'
      description: '**{tag} Role:** {role}

        **{frame} Icon:** updated by {actor}.'
    member_add:
      title: '{plus} Member Added'
      description: '**{tag} Role:** {role}

        {member} joined the role.

        **{gear} Added by:** {actor}'
    member_remove:
      title: '{minus} Member Removed'
      description: '**{tag} Role:** {role}

        {member} was removed from the role.

        **{gear} Removed by:** {actor}'
    member_left:
      title: '{door} Member Left the Role'
      description: '**{tag} Role:** {role}

        {member} left the role.

        **{people} Owner:** {owner}'
    invite_sent:
      title: '{love_letter} Invite Sent'
      description: '**{tag} Role:** {role}

        **{people} Invitee:** {invitee}

        **{people} By:** {inviter}

        **{clock} Expires:** {expires}'
    invite_cancelled:
      title: '{error} Invite Cancelled'
      description: '**{tag} Role:** {role}

        Invite for {invitee} cancelled.

        **{gear} By:** {actor}'
    invite_accepted:
      title: '{success} Invite Accepted'
      description: '**{tag} Role:** {role}

        {member} accepted the invite.

        **{people} Invited by:** {inviter}'
    invite_declined:
      title: '{error} Invite Declined'
      description: '**{tag} Role:** {role}

        {member} declined the invite.

        **{people} Invited by:** {inviter}'
    invite_expired:
      title: '{clock} Invite Expired'
      description: '**{tag} Role:** {role}

        Invite for {invitee} expired.

        **{people} Invited by:** {inviter}'
    auto_transfer:
      title: '{warning} Automatic Ownership Transfer'
      description: '**{tag} Role:** {role} was transferred from {old_owner} to {new_owner}.'
    orphan_remove:
      title: '{ban} Orphan Role Removed'
      description: '**{tag} Role:** {role} from {owner} was removed from the system.'
    auto_create:
      title: '{crown} Boost Role Created Automatically'
      description: '**{tag} Role:** {role}

        **{crown} Owner:** {owner}


        The role was created automatically because the owner boosted the server.'
    unboost:
      title: '{warning} Boost Ended'
      description: '**{tag} Role:** {role}

        **{crown} Owner:** {owner}

        **{gear} Action:** {action}'
  error_disabled: '{error} The boost roles system is disabled in this server.'
boost_admin:
  command:
    name: admin
    description: Admin boost roles panel
boost_panel:
  command:
    name: panel
    description: Boost roles panel
