        **{member_id_label}:** `{member_id}`

        **{moderator_label}:** {moderator}

        **{reason_label}:** {reason}'
      title: '{kick} Kick'
    mute:
      description: '**{member_label}:** {member}

        **{member_id_label}:** `{member_id}`

        **{moderator_label}:** {moderator}

        **{duration_label}:** {duration}

        **{reason_label}:** {reason}'
      title: '{mute} Mute'
    warn:
      description: '**{member_label}:** {member}

        **{member_id_label}:** `{member_id}`

        **{moderator_label}:** {moderator}

        **{reason_label}:** {reason}'
      title: '{warning} Warn'
mute:
  command:
    name: mute
    description: Mute a member for a duration
    options:
      member:
        description: Member to mute
      duration:
        description: Duration (e.g. 10m, 2h, 3d)
      reason:
        description: Reason
  confirm_title: Mute this member?
  success: '{success} {member} was muted for {duration}.'
  dm: 'You were muted in **{guild}** by {moderator}!

    • **{clock} Duration:** {duration}

    • **{scroll} Reason:** {reason}'
  invalid_duration: '{error} Invalid duration. Use formats like 10m, 2h or 3d.'
  summary: '{member}

    • **{clock} Duration:** {duration}

    • **{scroll} Reason:** {reason}'
trap:
  reason: Fell into the trap channel
  notice:
    text: 'This channel is a **moderation trap** on {server}.


      ### {ban} Do not send messages here

      > This is a moderation trap channel to catch spam, bot and RAID accounts. Anyone posting here loses the message instantly and faces a consequence.


      **{gear} Configured consequence:** {action}


      {envelope} Fell here by mistake? Talk to the moderation team.'
    action:
      none: The message is deleted.
      kick: Kick from the server.
      softban: Kick with a purge of recent messages.
      ban: Ban from the server.
  failure:
    no_ban: The bot lacks the ban permission (or the victim role is above its own).
    no_kick: The bot lacks the kick permission.
    no_hierarchy: The victim role is above the bot role.
    no_unban: 'The ban worked but the softban unban failed: the victim stays banned.'
  logs:
    failed:
      title: '{error} Trap Failed'
      description: '**{people} Target:** {user}\n**{gear} Consequence:** {action}\n**{scroll} Reason:** {reason}'
  dm:
    text: 'You posted in the trap channel of **{server}** and the message was removed.


      {action}


      This is an automated notification. Questions? Talk to the moderation team.'
    action:
      none: Your message was deleted.
      kick: You were kicked from the server.
      softban: You were kicked and your recent messages were purged. You can come back with a new invite.
      ban: You were banned from the server and your recent messages were purged.
  audit:
    applied: Consequence applied
    skipped: Failed to apply (permission or hierarchy)
    action:
      none: Delete message only
      kick: Kick
      softban: Softban
      ban: Ban
    user_label: Target
    action_label: Consequence
    reason_label: Reason
unwarn:
  command:
    name: unwarn
    description: Remove a warning
    options:
      member:
        description: Member to un-warn
      index:
        description: Warning number (omit to clear all)
  clear_all_title: Clear all warnings?
  clear_all_summary: Remove every warning from {member}?
  cleared: '{success} Removed {count} warning(s) from {member}.'
  removed: '{success} Warning #{index} removed from {member}.'
  invalid_index: '{error} No warning with that number.'
  none_for: '{success} This member has no warnings to clear.'
warn:
  command:
    name: warn
    description: Warn a member
    options:
      member:
        description: Member to warn
      reason:
        description: Reason
  confirm_title: Warn this member?
  success: '{success} Warning recorded for {member} ({count}/{limit}).'
  dm: 'You received a warning in **{guild}** from {moderator}!

    • **{scroll} Reason:** {reason}'
warnings:
  command:
    name: warnings
    description: List a member's warnings
    options:
      member:
        description: Member to inspect
  title: Warnings for {member}
  none: '{success} This member has no warnings.'
  entry: '{reason}

    by {moderator} · {date}'
