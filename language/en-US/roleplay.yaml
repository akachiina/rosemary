roleplay:
  command:
    name: roleplay
    description: Send a roleplay card
  error_disabled: Roleplay is disabled on this server.
  error_self: You cannot interact with yourself... or can you? Try mentioning someone else!
  error_bot: Bots do not join the roleplay.
  error_not_target: Only the recipient can give it back.
  error_gone: A participant of this roleplay is no longer on the server.
  error_no_gif: '{error} No gif source is available for this roleplay (the API is down and nothing is configured).'
  regive: Give it back
  regiven: Given back
  regive_labels:
    hug: Hug back
    kiss: Kiss back
    pat: Pat back
    slap: Slap back
    bite: Bite back
    punch: Punch back
    attack: Attack back
    poke: Poke back
    dance: Dance back
    highfive: High-five back
    stare: Stare back
    cuddle: Cuddle back
  actions:
    hug: hugged
    kiss: kissed
    pat: patted
    slap: slapped
    bite: bit
    punch: punched
    attack: attacked
    poke: poked
    dance: danced with
    highfive: high-fived
    stare: stared at
    cuddle: cuddled with
  card:
    title: Roleplay card
    ping: '{actor} {action} {target}.'
  panel:
    title: Roleplay
    text: Pick a member and an action.
    pick: Pick a member
    pick_first: Pick a member first.
    posted: '{success} Roleplay panel posted.'
    actions:
      hug: Hug
      kiss: Kiss
      pat: Pat
      slap: Slap
      bite: Bite
      punch: Punch
      attack: Attack
      poke: Poke
      dance: Dance
      highfive: High-five
      stare: Stare
      cuddle: Cuddle
  source: Image source
  manager:
    title: Manage gifs
    body: 'Action: **{action}**. `api` = random gif from the category (nekos.best); `url` = fixed gif.'
    empty: No gif configured for this action (the default API is the fallback).
    add: Add gif
    add_hint: Paste the gif URL (leave the category empty to use only the URL).
    add_api_hint: API category (e.g. hug, kiss). Leave empty if you filled the URL.
    add_modal_title: New gif
    edit_hint: Remove a gif...
    remove_hint: Remove a gif...
    restore: Restore from theme
    restored: '{refresh} List restored from the theme.'
    removed: '{trash} Gif removed.'
    added: '{plus} Gif added.'
    invalid: '{error} Fill a valid URL (http) OR an API category (letters and numbers).'
    api_offline: '{warning} The nekos.best API did not answer; check back later or use a fixed URL.'
    save: Save
    cancel: Cancel
    list_title: Configured gifs
    mode_api: random (API)
    mode_url: fixed
