language_meta:
  name: English
  flag: 🇺🇸
about:
  command:
    name: about
    description: About Rosemary
  title: About Rosemary
  text: Rosemary is a minimal, multilingual Discord bot built with py-cord.
  version: 'Version: {version}'
  footer: 'Commands: /about, /language, /settings, /boost, /boost_admin, /ban, /warn, /debug'
language:
  command:
    name: language
    description: Set the server language
  title: Language
  text: Choose the language used by the bot in this server.
  updated: '{success} Language set to **{language}**.'
  invalid: '{error} Unknown language ''{language}''.

    Available:

    {available}'
  current: 'Current language: {language}.'
general:
  unknown_error: '{error} An unexpected error occurred.'
menu:
  owner_only: '{error} This menu is private. Only the author can interact.'
errors:
  generic: '{error} Something went wrong.'
settings:
  title: Bot Settings
  command:
    name: settings
    description: Configure the bot settings
  hint: Pick a category to browse its settings.
  category_label: Category
  category:
    placeholder: Select a category
    general: General
    moderation: Moderation
    logging: Logging
    boost: Boost Roles
    bump: Disboard Bump
    events: Announcements
    starboard: Starboard
    birthdays: Birthdays
    invites: Invites
    tickets: Tickets
    partnerships: Partnerships
  bump.enabled:
    label: Disboard Bump Enabled
    description: Enables or disables the Disboard Bump reminder and leaderboard system.
  bump.channel:
    label: Bump Channel
    description: The channel where the Disboard bot posts and where reminders are sent.
  bump.ping_role:
    label: Ping Role
    description: Role to mention when the bump reminder is sent.
  bump.cooldown:
    label: Bump Cooldown
    description: Cooldown required by Disboard between bumps (e.g. 2h, 90m).
  bump.anti_camping.enabled:
    label: Anti-camping Enabled
    description: Lock the channel shortly before the bump becomes available to prevent camping.
  bump.anti_camping.lock_delay:
    label: Lock Advance Time
    description: How long before the bump is available to lock the channel (e.g. 15m).
  bump.anti_camping.unlock_delay:
    label: Unlock Delay
    description: Time after cooldown to unlock the channel (e.g. 15s).
  bump.anti_camping.message:
    label: Anti-camping Message
    description: The message shown when the channel is locked by anti-camping.
  bump.detection_text:
    label: Bump Detection Text
    description: Text Disboard posts on a successful bump (e.g. "Bump done"). Matching is case-insensitive.
  bump.leaderboard.enabled:
    label: Weekly Leaderboard Enabled
    description: Enables the weekly ranking and Bump-MVP role.
  bump.leaderboard.winner_role:
    label: Winner Role
    description: Temporary role granted to the weekly Bump-MVP.
  bump.leaderboard.reset_day:
    label: Weekly Reset Day
    description: The day of the week when the leaderboard resets.
    choices:
      Monday: Monday
      Tuesday: Tuesday
      Wednesday: Wednesday
      Thursday: Thursday
      Friday: Friday
      Saturday: Saturday
      Sunday: Sunday
  bump.leaderboard.reset_hour:
    label: Reset Hour (0-23)
    description: The exact hour of the day to reset the leaderboard (e.g. 20).
  invites.enabled:
    label: Invite Tracking Enabled
    description: Tracks which invite each member joined with.
  invites.show_inviter:
    label: Show Inviter
    description: Show who invited each member in the welcome card.
  invites.track_leaves:
    label: Track Leaves
    description: Subtract from the inviter when an invited member leaves.
  invites.count_rejoins:
    label: Count Rejoins
    description: Count members who leave and rejoin again.
  invites.fake_delay_days:
    label: Fake Delay (days)
    description: Accounts younger than this count as fake (0 disables).
  invites.anti_cheat_days:
    label: Anti-cheat Window (days)
    description: Rejoins via another inviter in this window earn nothing (0 disables).
  invites.leaderboard_enabled:
    label: Invites Leaderboard Enabled
    description: Enables the top inviters ranking.
  invites.leaderboard_size:
    label: Leaderboard Size (5-25)
    description: How many inviters the ranking shows.
  edit: Edit
  back: Back
  close: Close
  prev: Previous
  next: Next
  edit_title: 'Edit: {setting}'
  select_value: Choose a new value.
  saved: '{success} Value set for {setting}.'
  invalid_value: '{error} Invalid value for {setting}.'
  default_value: 'Default: {value}'
  test:
    title: '{rocket} Test Bump System'
    hint: Trigger real bump system actions to validate without waiting for the cooldown.
    thank_you: Bump Message
    reminder: Send Reminder
    leaderboard: Post Leaderboard
    lock: Lock Channel
    unlock: Unlock Channel
    reset: Reset Week
    thank_you_done: '{success} Thank-you message sent in the bump channel.'
    reminder_done: '{success} Reminder sent in the bump channel.'
    lock_done: '{success} Bump channel locked.'
    unlock_done: '{success} Bump channel unlocked.'
    leaderboard_done: '{success} Weekly leaderboard posted in the bump channel.'
    no_data: '{error} No bump data this week to post.'
    reset_done: '{success} Bump week reset.'
    error: '{error} The bump system is not loaded.'
    open: Test actions
  none: Not set
  page_indicator: Page {page} of {pages}
  log:
    title: '{gear} Setting Changed'
    description: '{setting}

      Category: {category}

      From: {old}

      To: {new}

      By: {author}'
    language_title: '{gear} Language Changed'
    language_description: 'From: {old}

      To: {new}

      By: {author}'
  bool:
    'true': 'On'
    'false': 'Off'
  general.timezone:
    label: Timezone
    description: Timezone used for timestamps.
  general.prefix:
    label: Bot prefix
    description: Prefix for text commands (e.g. !warn).
  general.menu_timeout:
    label: Menu timeout
    description: Seconds until an interactive menu expires (60-900).
  moderation.enabled:
    label: Moderation enabled
    description: Whether moderation commands work in this server.
  moderation.warn_limit:
    label: Warning limit
    description: Warnings before the limit is reached (1-10).
  moderation.auto_ban_enabled:
    label: Auto-ban at limit
    description: Ban members reaching the warning limit.
  cleaner.enabled:
    label: Message cleaner enabled
    description: Whether the keyword purge command works.
  anti_invite.enabled:
    label: Anti-invite enabled
    description: Delete external invite links on sight.
  anti_invite.warn_on_delete:
    label: Warn on delete
    description: Post a warning when an invite is deleted.
  anti_invite.exempt_channel:
    label: Anti-invite exempt channel
    description: Channel where invite links are allowed.
  reminders.enabled:
    label: Reminders enabled
    description: Whether saved DM reminders can be used.
  reminders.delay_seconds:
    label: Reminder DM delay (0-30s)
    description: Pause between reminder DMs.
  broadcast.enabled:
    label: Broadcasts enabled
    description: Whether live broadcast relay can be used.
  broadcast.delay_seconds:
    label: Broadcast DM delay (0-30s)
    description: Pause between broadcast DMs.
  updater.enabled:
    label: Self-update enabled
    description: Whether /update can restart the bot.
  updater.branch:
    label: Update branch
    description: Git branch to update from.
  tickets.enabled:
    label: Tickets enabled
    description: Whether the ticket panel works.
  tickets.panel_channel:
    label: Ticket panel channel
    description: Channel where the ticket panel is posted.
  tickets.category:
    label: Ticket category
    description: Category for opened ticket channels.
  tickets.max_open_per_user:
    label: Max open tickets (1-10)
    description: Open tickets allowed per member.
  partnerships.enabled:
    label: Partnerships enabled
    description: Whether partnership ads work.
  partnerships.channel:
    label: Partnerships channel
    description: Channel where partnership ads are posted.
  partnerships.role:
    label: Partner role
    description: Role granted to partnership representatives.
  partnerships.ping_role:
    label: Partnerships ping role
    description: Role pinged on partnership expiry.
  partnerships.renewal_days:
    label: Renewal period (days)
    description: Days before a partnership ad expires (1-90).
  partnerships.grace_days:
    label: Grace period (days)
    description: Days after expiry before removal (0-30).
  moderation.mute_seconds:
    label: Default mute duration
    description: Default mute duration in seconds (60-604800).
  logging.enabled:
    label: Logging enabled
    description: Whether bot events are posted to a log channel.
  logging.channel:
    label: Log channel
    description: Channel where bot events are posted.
  boost.enabled:
    label: Boost roles enabled
    description: Defines whether the boost roles system works in this server.
  boost.max_members:
    label: Boost role member limit
    description: Maximum members per boost role (1-25).
  boost.invite_seconds:
    label: Boost invite duration
    description: How long boost invites stay valid.
  boost.max_pending_invites:
    label: Pending invites limit
    description: Maximum pending invites per boost role (1-20).
  events.enabled:
    label: Announcements enabled
    description: Send welcome, leave and ban messages.
  events.welcome_channel:
    label: Welcome channel
    description: Channel for member join messages.
  events.leave_channel:
    label: Leave channel
    description: Channel for member leave messages.
  events.ban_channel:
    label: Ban channel
    description: Channel for ban announcements.
  events.raid_protection:
    label: Raid protection
    description: Delay welcomes when many members join at once.
  starboard.enabled:
    label: Starboard enabled
    description: Highlight popular messages in the starboard channel.
  starboard.channel:
    label: Starboard channel
    description: Channel where highlighted messages are posted.
  starboard.threshold:
    label: Star threshold (1-25)
    description: Reactions needed to highlight a message.
  starboard.self_star_counts:
    label: Self-star counts
    description: Whether the author's own star counts.
  starboard.allow_bots:
    label: Allow bot messages
    description: Whether bot messages can be highlighted.
  birthdays.enabled:
    label: Birthdays enabled
    description: Track birthdays and post announcements.
  birthdays.channel:
    label: Birthday channel
    description: Channel for birthday announcements.
  birthdays.role:
    label: Birthday role
    description: Role granted to celebrants for the day.
  birthdays.announce_time:
    label: Announce time
    description: 'Daily announce time (HH:MM, e.g. 12:00).'
  birthdays.change_cooldown_days:
    label: Change cooldown (days)
    description: Days before a birthday can be changed (0-365).
