    name: language
    description: Set the server language
  title: Language
  text: Choose the language used by the bot in this server.
  updated: '{success} Language set to **{language}**.'
  invalid: '{error} Unknown language ''{language}''.

    Available:

    {available}'
  current: 'Current language: {language}.'
themes:
  command:
    name: themes
    description: Manage this server's themes
  title: Themes
  hint: 'Import a theme file, pick the active one, or export/download what is installed.'
  active_none: Built-in default
