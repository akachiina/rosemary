bump:
  messages:
    anti_camping: 🔒 **|** The channel is temporarily locked. Bump will be available shortly!
    thank_you_title: '{tada} Bump Recorded!'
    thank_you_description: 'Thank you for the bump, {mention}! Your dedication keeps the server shining.
      {cup}


      {clock} **|** I''ll remind you in **{cooldown}!**

      > **Next bump:** <t:{next_bump_timestamp}:R>


      {trophy} **|** Use `/bump_leaderboard` to check the weekly rank and compete for **Bump-MVP!**

      '
    reminder_title: '{clock} Bump Time!'
    reminder_description: 'The {cooldown} cooldown has passed since the last bump!


      How about helping us welcome new visitors? Use `/bump` and earn a point!

      '
    leaderboard_title: '{trophy} Weekly Bump Leaderboard'
    leaderboard_description: 'Check out who helped the server the most this week!


      **{calendar} Period:** <t:{start_timestamp}:d> - <t:{end_timestamp}:d>

      **{hourglass} The week ends in:** <t:{next_reset_timestamp}:R>

      **{crown} Winner:** {winner_mention} with **{winner_count}** bumps!


      **{gift} Prize:** Customizable **{role_name}** role for 1 week!

      -# Use `/boost` to customize name, color, emoji and invite members.


      {leaderboard_list}

      '
    leaderboard_line: '{medal} **{position}º** - {user_mention} **{bump_count}** bumps'
    no_bumps_title: '{bar_chart} Weekly Bump Leaderboard'
    no_bumps_description: 'Nobody bumped the server this week! {cry}

      Be the first to help out by using `/bump`!

      '
    no_bumps_you: '{bar_chart} You haven''t bumped this week yet! Use `/bump` in the bump channel.'
  dm:
    winner_new: '{tada} You are the Bump-MVP of the Week!

      Hello, {mention}! Your dedication kept the server shining. Thank you!


      > **{bar_chart} Weekly bumps:** `{bump_count}`

      > **{trophy} Role:** `{role_name}`


      ### {palette} Customize your role

      Use `/boost` to customize:

      > {pencil} Name and emoji

      > {palette} Color

      > {members} Invite up to **{max_members}** members


      -# Your customizations are saved and will return if you win again!


      Enjoy it until the next reset.

      '
    winner_again: '{tada} Bump-MVP once again!

      Hello, {mention}! You''ve reclaimed the title. Your dedication is admirable!


      > **{bar_chart} Weekly bumps:** `{bump_count}`

      > **{trophy} Total wins:** `{total_wins}`


      Your role **{role_name}** has been restored with your previous customizations!


      Keep being awesome.

      '
    winner_lost: '{cry} Your time as Bump-MVP has ended

      Hello, {mention}! This week another member claimed the title. Don''t be discouraged!


      > **{bar_chart} Your bumps:** `{bump_count}`

      > **{crown} New winner:** {winner_mention}


      -# Your customizations were saved and will return if you win again!


      Keep bumping and reclaim the throne!

      '
  logs:
