    transfer:
      title: Transfer Ownership
      label: New owner
      placeholder: User ID
    register_owner:
      title: Role Owner
      label: New owner
      placeholder: User ID
  dm:
    registered: '{crown} You received a Boost Role!

      Hello, {mention}! The boost role @{role_name} was registered for you on **{server_name}**.


      {pencil} Rename and pick an emoji

      {palette} Change the color

      {members} Invite up to **{max_members}** members

      {swap} Transfer ownership


      Use the boost roles panel to manage everything.

      '
    transferred: '{crown} Ownership Transferred!

      Hello, {mention}! Ownership of the boost role @{role_name} was transferred to you on **{server_name}**.


      {pencil} Rename and pick an emoji

      {palette} Change the color

      {members} Invite up to **{max_members}** members

      {swap} Transfer ownership


      Use the boost roles panel to manage everything.

      '
    auto_transferred: '{swap} Ownership Transferred Automatically!

      Hello, {mention}! Since the previous owner left the server, ownership of the boost role @{role_name}
      was transferred to you on **{server_name}**.


      Use the boost roles panel to manage your role.

      '
    invite: '{love_letter} Boost Role Invite!

      Hello, {mention}! You have been invited to join a boost role on **{server_name}**.


      > **{tag} Role:** @{role_name}

      > **{user} Invited by:** {inviter_mention}

      > **{clock} Expires:** {expires}


      -# By accepting, you will receive the role and can use it on the server. Use the buttons below to
      reply!

      '
    accepted: '{success} Invite Accepted!

      The role @{role_name} was added to you successfully.

      -# To leave the role at any time, use `/boost`.

      '
    declined: '{info} Invite Declined

      You declined the invite for the role @{role_name}.

      -# The role owner was notified about your decision.

      '
    owner_accepted: '{success} Invite Accepted!

      {member_mention} accepted your invite and was added to the role @{role_name}!

      '
    owner_declined: '{info} Invite Declined

      {member_mention} declined your invite for the role @{role_name}.

      -# You can invite someone else if you wish.

      '
    member_left: '{door} You Left the Role

      You left the role @{role_name} successfully.

      -# The role owner was notified.

      '
    owner_member_left: '{door} Member Left the Role

      {member_mention} left the role @{role_name}.

      -# You can add another member if you wish.

      '
    error: '{error} Oops!

      {body}

      '
